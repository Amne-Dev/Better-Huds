plugins {
	id 'fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

def sanitizeLabel = { String raw ->
	def value = raw == null ? "" : raw.toString()
	def normalized = value.replaceAll(/[^0-9A-Za-z.\-]/, "-")
	return normalized.isEmpty() ? "unknown" : normalized
}

def buildMinecraftVersion = project.minecraft_version.toString()
def supportedMinecraftVersions = ['1.21', '1.21.8', '1.21.11', '26.1', '26.2']
if (!supportedMinecraftVersions.contains(buildMinecraftVersion)) {
	throw new GradleException("Unsupported Minecraft version '${buildMinecraftVersion}'. Supported versions: ${supportedMinecraftVersions.join(', ')}")
}
apply plugin: buildMinecraftVersion.startsWith("26.") ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
def buildCompatGroup = (findProperty("mc_compat_group") ?: buildMinecraftVersion).toString()
def buildProfileName = (findProperty("build_profile_name") ?: buildCompatGroup).toString()
def buildDependencyRange = (findProperty("mc_dependency_range") ?: buildMinecraftVersion).toString()
def buildVersionLabel = sanitizeLabel((findProperty("build_version_label") ?: buildMinecraftVersion).toString())
def fabricLoaderDependencyRange = (findProperty("fabric_loader_dependency") ?: ">=0.18.0").toString()
def fabricApiDependencyRange = (findProperty("fabric_api_dependency") ?: "*").toString()
def javaDependencyRange = (findProperty("java_dependency") ?: (buildMinecraftVersion.startsWith("26.") ? ">=25" : ">=21")).toString()
def archiveCompatLabel = sanitizeLabel(buildCompatGroup)
def javaLanguageVersion = JavaVersion.toVersion(buildMinecraftVersion.startsWith("26.") ? 25 : 21)

version = "${project.mod_version}+mc${buildVersionLabel}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${archiveCompatLabel}"
}

def isLegacy1218 = { String version ->
	def matcher = (version =~ /^(\d+)\.(\d+)(?:\.(\d+))?.*$/)
	if (!matcher.matches()) {
		return false
	}
	int major = matcher.group(1) as int
	int minor = matcher.group(2) as int
	if (major != 1 || minor != 21) {
		return false
	}
	String patchGroup = matcher.group(3)
	int patch = patchGroup ? (patchGroup as int) : 0
	return patch <= 8
}

def useLegacyMinecraft = buildMinecraftVersion.startsWith("1.21")
def useLegacyInputUi = isLegacy1218(buildMinecraftVersion)
if (useLegacyMinecraft) {
	def legacyMinecraftFiles = fileTree('src/legacy12111/java') {
		include '**/*.java'
	}.files.collect { file('src/legacy12111/java').toPath().relativize(it.toPath()).toString().replace('\\', '/') }
	def legacyUiFiles = [
		'amdev/bh/ui/HudEditorScreen.java',
		'amdev/bh/ui/ColorPickerScreen.java',
		'amdev/bh/ui/CrosshairDrawScreen.java',
		'amdev/bh/ui/HudSettingsScreen.java',
		'amdev/bh/ui/ItemCounterSetupScreen.java',
		'amdev/bh/ui/widget/GlassButton.java'
	]

	sourceSets.main.java.srcDir 'src/legacy12111/java'
	if (useLegacyInputUi) {
		sourceSets.main.java.srcDir 'src/legacy1218/java'
	}
	tasks.withType(JavaCompile).configureEach { task ->
		task.setSource(files(
			fileTree('src/main/java') {
				exclude legacyMinecraftFiles
			},
			fileTree('src/legacy12111/java') {
				if (useLegacyInputUi) {
					exclude legacyUiFiles
				}
			},
			useLegacyInputUi ? fileTree('src/legacy1218/java') : files()
		))
	}
	tasks.matching { it.name == 'sourcesJar' }.configureEach { task ->
		task.setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
		task.from(fileTree('src/main/java') {
			exclude legacyMinecraftFiles
		})
		task.from(fileTree('src/legacy12111/java') {
			if (useLegacyInputUi) {
				exclude legacyUiFiles
			}
		})
		if (useLegacyInputUi) {
			task.from(fileTree('src/legacy1218/java'))
		}
	}
	logger.lifecycle("Better Huds: enabling the 1.21 compatibility sources for Minecraft ${buildMinecraftVersion}")
	if (useLegacyInputUi) {
		logger.lifecycle("Better Huds: enabling legacy UI input shims for Minecraft ${buildMinecraftVersion}")
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (!buildMinecraftVersion.startsWith("26.")) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", buildMinecraftVersion
	inputs.property "mc_compat_group", buildCompatGroup
	inputs.property "mc_dependency_range", buildDependencyRange
	inputs.property "build_profile_name", buildProfileName
	inputs.property "fabric_loader_dependency", fabricLoaderDependencyRange
	inputs.property "fabric_api_dependency", fabricApiDependencyRange
	inputs.property "java_dependency", javaDependencyRange

	filesMatching("fabric.mod.json") {
		expand(
			"version": inputs.properties.version,
			"minecraft_version": inputs.properties.minecraft_version,
			"mc_compat_group": inputs.properties.mc_compat_group,
			"mc_dependency_range": inputs.properties.mc_dependency_range,
			"build_profile_name": inputs.properties.build_profile_name,
			"fabric_loader_dependency": inputs.properties.fabric_loader_dependency,
			"fabric_api_dependency": inputs.properties.fabric_api_dependency,
			"java_dependency": inputs.properties.java_dependency
		)
	}

	filesMatching("better-huds.mixins.json") {
		filter { line ->
			if (useLegacyMinecraft && line.trim() == '"client": [') {
				return line + System.lineSeparator() + '\t\t"GuiMixin",'
			}
			return line
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaLanguageVersion.majorVersion.toInteger()
}

tasks.withType(Test).configureEach {
	// This project has no active JVM tests yet; don't fail multi-version builds.
	failOnNoDiscoveredTests = false
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = javaLanguageVersion
	targetCompatibility = javaLanguageVersion
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
